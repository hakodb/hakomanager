[package]
name = "hakomanager-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI-independent core for HakoManager: command dispatch, DTOs and engine adapter"

[dependencies]
hakodb = "0.21.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
crossbeam-channel = "0.5"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "io-util", "sync", "macros"] }
