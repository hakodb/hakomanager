[package]
name = "hakomanager-tauri"
version = "0.1.5"
edition = "2021"
description = "Tauri 2 desktop shell for HakoManager"

[lib]
crate-type = ["lib"]

[features]
# Toggles the shell between the embedded production UI (release) and the
# vite dev server URL (`tauri dev`). Plain `cargo build --release` must pass
# `--features custom-protocol` or the exe ships pointing at localhost:1420.
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "hakomanager"
path = "src/main.rs"

[dependencies]
hakomanager-core = { path = "../hakomanager-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
crossbeam-channel = "0.5"
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
